# PID tuning parameters (loaded by controller)
pid:
  linear:
    kp: 0.7
    ki: 0.1
    kd: 0.0
    refresh_rate: 100.0
  angular:
    kp: 2.0
    ki: 2.0
    kd: 5.0
    refresh_rate: 100.0

# Velocity limits
velocity:
  max_linear: [0.1, 0.06, 0.08] # x, y, z in m/s
  max_angular: 2.0 # rad/s
  max_finger: 2000.0 # units/s

# Rotation quantization
rotation:
  discretise: true
  quantisation_degrees: 30.0
  max_angle_difference: 0.785 # 45 degrees in radians
