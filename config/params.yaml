/jaco_controller:
  ros__parameters:
    cartesian_movement_enabled: True
    normalise_cartesian_speed: False
    relative_cartesian_movement_enabled: False
    max_linear_velocity:
      - 0.1
      - 0.06
      - 0.08
    max_angular_velocity: 8.0
    max_finger_velocity: 2000.0
    discretise_rotation: True
    quantisation_degrees: 30
    pid_enabled: True
    kp_linear: 0.82
    ki_linear: 0.005
    kd_linear: 0.001
    kp_angular: 1.8
    ki_angular: 0.01
    kd_angular: 0.01
    discrete_motion_speed: 0.50
    waypoint_position_threshold: 0.005
    waypoint_orientation_threshold_deg: 5.0
    waypoint_timeout_sec: 10.0
    camera_rotation_compensation: False
    rotation_assistance: 2.0
